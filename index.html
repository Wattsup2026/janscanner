<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JAN照合スキャナー</title>
<meta name="theme-color" content="#0f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JANスキャナー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: one narrow column like a handheld terminal — scan area on top, input with suggestions, result card, history, master */
:root{
  --bg:#eef1ef; --surface:#ffffff; --fg:#17201c; --muted:#5d6a64; --line:#d3dad6;
  --accent:#0f6b4f; --accent-fg:#ffffff; --accent-soft:#dcefe7;
  --warn:#9a5a00; --warn-soft:#fbefd9; --err:#a3302a; --err-soft:#f8e0de; --hl:#fff1a8;
  --font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111715; --surface:#1a2320; --fg:#e6ece9; --muted:#9aa8a1; --line:#2c3833;
  --accent:#4fc39a; --accent-fg:#06231a; --accent-soft:#183a2e;
  --warn:#f0b35a; --warn-soft:#3a2c14; --err:#f08a82; --err-soft:#3d1f1d; --hl:#5a4a00; color-scheme:dark}}
*{box-sizing:border-box}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px}
.gate-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.gate-box img{border-radius:14px}
.gate-box h1{font-size:20px}
.gate-box p{margin:0;color:var(--muted);font-size:14px}
.gate-box input{width:100%;font:inherit;font-family:var(--font-mono);font-size:22px;letter-spacing:.3em;text-align:center;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.gate-box .primary{width:100%}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:50;background:var(--fg);color:var(--bg);font-weight:700;font-size:17px;padding:16px 26px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.gate-msg{min-height:1.4em;color:var(--err)!important;font-weight:600}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header .ttl{display:flex;flex-direction:column;gap:0;min-width:0}
button.endbtn{padding:8px 12px;font-size:13px;font-weight:700;color:var(--err);border:2px solid var(--err);background:var(--surface)}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.net{font-size:12px;color:var(--muted)}
.label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);
  padding:12px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;
  -webkit-tap-highlight-color:transparent}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;font-size:17px;padding:16px}
.primary.stop{background:var(--surface);color:var(--fg);border-color:var(--line)}
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary.alt{background:var(--surface);color:var(--accent);border:2px solid var(--accent)}
.video-wrap .count{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:14px;padding:4px 10px;border-radius:999px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.video-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.video-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.video-wrap .aim{position:absolute;left:8%;right:8%;top:38%;height:24%;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.35);transition:border-color .15s}
.video-wrap .aim.hit{border-color:#4fc39a}
.video-wrap .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
.status{font-size:13px;color:var(--muted);min-height:1.4em;margin:0}
.status.err{color:var(--err)}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;font:inherit;font-family:var(--font-mono);font-size:18px;letter-spacing:.06em;
  padding:11px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.sugg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sugg-head{font-size:12px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.sugg ul{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sugg li button{width:100%;border:0;border-top:1px solid var(--line);border-radius:0;background:none;
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:10px 12px;font-weight:400}
.sugg li:first-child button{border-top:0}
.sugg .sj{font-family:var(--font-mono);font-size:14px;letter-spacing:.04em;color:var(--muted)}
.sugg .sj mark{background:var(--hl);color:var(--fg);border-radius:3px;padding:0 1px;font-weight:700}
.sugg .sn{grid-column:1/-1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg .sc{font-size:12px;color:var(--muted);white-space:nowrap}
.sugg li button.more{display:flex;justify-content:center;color:var(--accent);font-weight:700}
.sugg .none{padding:12px;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.found{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.missing{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.chip{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.no{background:var(--warn-soft);color:var(--warn)}
.jan{font-size:22px;letter-spacing:.08em;margin:0}
.jan span{margin-right:.45em}
.cls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.cls .code{background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:6px}
dl.fields dd .cls{color:var(--fg);font-size:15px}
.rank{display:inline-flex;align-items:center;justify-content:center;min-width:2em;padding:1px 8px;border-radius:6px;font-weight:800;
  background:var(--line);color:var(--fg)}
.rank.rA,.rank.rB,.rank.rC,.rank.rD{background:var(--accent);color:var(--accent-fg)}
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cmp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cmp-tools{display:flex;gap:6px}
button.seg{padding:5px 10px;font-size:12px;font-weight:600;border-radius:999px}
button.seg.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.seg.clr{color:var(--muted)}
.cmp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cmp-list li{display:grid;grid-template-columns:2.4em 1fr auto;gap:4px 10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer}
.cmp-list li:first-child{border-top:0}
.cmp-list .rank{min-width:2.2em;font-size:16px;padding:3px 0;justify-content:center}
.cmp-list .rank.none{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:11px;font-weight:600}
.cmp-list .nm{min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-list .sub{grid-column:2/4;font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-list .no{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;white-space:nowrap}
.cmp-list li.best{background:var(--accent-soft);border-radius:8px}
.cmp-list .top{font-size:10px;font-weight:800;color:var(--accent);margin-left:6px}
.pass{display:flex;gap:8px}
.pass input{flex:1;min-width:0;font:inherit;font-family:var(--font-mono);font-size:18px;letter-spacing:.3em;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.pname{font-size:20px;font-weight:700;margin:0;line-height:1.4}
.meta{font-size:12px;color:var(--muted)}
.meta.err{color:var(--err)}
dl.fields{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;border-top:1px solid var(--line);padding-top:10px}
dl.fields dt{color:var(--muted);font-size:13px}
dl.fields dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
dl.fields dd.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;margin:0}
section{display:flex;flex-direction:column;gap:8px}
ul.hist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
ul.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
ul.hist li:first-child{border-top:0}
ul.hist .t{font-size:12px;color:var(--muted)}
ul.hist .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dot.no{background:var(--warn)}
.master{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.master p{margin:0;font-size:13px;color:var(--muted)}
.master strong{color:var(--fg)}
.tag{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:1px 8px;border-radius:999px;margin-left:6px}
code{font-family:var(--font-mono);font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
footer{font-size:11px;color:var(--muted);text-align:center}
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
button.clear{padding:6px 12px;font-size:13px;font-weight:600;color:var(--err);border-color:var(--line)}
#logoutBtn.armed,button.clear.armed{background:var(--err);color:#fff;border-color:var(--err)}
@media (prefers-reduced-motion:no-preference){.card.flash{animation:fl .35s ease}@keyframes fl{from{transform:scale(.98)}to{transform:none}}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form class="gate-box" id="gateForm" autocomplete="off">
    <img src="icon-192.png" alt="" width="64" height="64">
    <h1>JAN照合スキャナー</h1>
    <p>スタッフ用パスワードを入力してください</p>
    <input id="gateInput" type="password" inputmode="numeric" placeholder="パスワード" aria-label="パスワード" autocomplete="off">
    <button type="submit" class="primary" id="gateBtn">ログイン</button>
    <p class="gate-msg" id="gateMsg" role="alert"></p>
  </form>
</div>
<div class="toast" id="toast" hidden></div>
<main id="app" hidden>
  <header>
    <div class="ttl"><h1>JAN照合スキャナー</h1><span class="net" id="net"></span></div>
    <button type="button" class="endbtn" id="endBtn">終了（ログアウト）</button>
  </header>

  <section aria-label="読み取り">
    <div class="scan-btns" id="scanBtns">
      <button type="button" class="primary" id="scanOne">1件スキャン</button>
      <button type="button" class="primary alt" id="scanCont">連続スキャン</button>
    </div>
    <button type="button" class="primary stop" id="scanStop" hidden>スキャン停止</button>
    <div class="video-wrap" id="videoWrap" hidden>
      <video id="video" playsinline muted autoplay></video>
      <div class="aim" id="aim"></div>
      <div class="count" id="scanCount" hidden></div>
      <div class="hint" id="scanHint"></div>
    </div>
    <p class="status" id="status" role="status"></p>
    <div class="cmp" id="cmp" hidden>
      <div class="cmp-head">
        <span class="label">ランク比較（直近5件）</span>
        <div class="cmp-tools">
          <button type="button" class="seg on" id="cmpByTime">読んだ順</button>
          <button type="button" class="seg" id="cmpByRank">ランク順</button>
          <button type="button" class="seg clr" id="cmpClear">クリア</button>
        </div>
      </div>
      <ol class="cmp-list" id="cmpList"></ol>
    </div>
  </section>

  <section aria-label="手入力">
    <form class="manual" id="manualForm" autocomplete="off">
      <input id="manualJan" inputmode="numeric" pattern="[0-9]*" maxlength="14" placeholder="JAN または 下5桁" aria-label="JANコードまたは下5桁">
      <button type="submit">照合</button>
    </form>
    <div class="sugg" id="sugg" hidden>
      <div class="sugg-head"><span id="suggHead"></span><span>タップで選択</span></div>
      <ul id="suggList"></ul>
    </div>
  </section>

  <article class="card" id="result"></article>

  <section>
    <div class="hist-head">
      <span class="label">スキャン履歴</span>
      <button type="button" class="clear" id="clearHist" hidden>履歴を消去</button>
    </div>
    <ul class="hist" id="hist"></ul>
  </section>

  <section>
    <span class="label">商品マスタ</span>
    <div class="master">
      <p id="masterInfo"></p>
      <p id="syncInfo" hidden></p>
      <form class="pass" id="passForm" autocomplete="off" hidden style="display:none">
        <input id="passInput" type="password" inputmode="numeric" placeholder="パスワード" aria-label="マスタ取得用パスワード">
        <button type="submit" class="primary" style="padding:10px 16px;font-size:15px">マスタを取得</button>
      </form>
      <div class="row2"><button type="button" id="syncBtn" hidden>マスタを今すぐ更新</button><button type="button" id="logoutBtn">ログアウト</button></div>
      <p>アプリを開くと、電波があるときは最新の商品マスタを自動で取り込みます。取り込んだマスタは端末に保存され、電波がなくても使えます。</p>
      <div class="row2">
        <label class="btn" for="csv">CSVを読み込む</label>
        <input id="csv" class="hidden-input" type="file" accept=".csv,text/csv,text/plain,text/comma-separated-values">
        <label class="btn" for="photo">写真から読み取る</label>
        <input id="photo" class="hidden-input" type="file" accept="image/*">
      </div>
    </div>
  </section>

  <footer>JAN照合スキャナー v12 ・ バーコード読み取り: ZXing (Apache License 2.0)</footer>
</main>

<script src="config.js"></script>
<script src="zxing.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);

/* ---------- storage ---------- */
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
const IDB={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open("janscan",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("kv",mode);const st=t.objectStore("kv");
    const req=fn(st);t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(k){return this.run("readonly",s=>s.get(k))},
  set(k,v){return this.run("readwrite",s=>s.put(v,k))}
};

/* ---------- master ---------- */
let master={headers:[],rows:[],name:"",ci:-1}, index=new Map(), keys=[], history=load("jan.hist")||[];
const JAN_KEYS=["jan","jan_code","jancode","janコード","バーコード","barcode","ean"];
function findCol(h,list){const n=h.map(x=>String(x).trim().toLowerCase().replace(/\s/g,""));for(const k of list){const i=n.indexOf(k);if(i>=0)return i}return -1}
function norm(s){return String(s||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\D/g,"")}
const colIdx={};
function setMaster(m){
  let ci=findCol(m.headers,JAN_KEYS); if(ci<0)ci=m.headers.findIndex(x=>/jan/i.test(x));
  if(ci<0)throw new Error("JANの列が見つかりません。1行目に「JAN」という見出しを入れてください。");
  index=new Map();
  for(const r of m.rows){const j=norm(r[ci]);if(j)index.set(j,r)}
  keys=[...index.keys()];
  master={...m,ci};
  const h=m.headers.map(x=>String(x).trim());
  const at=re=>h.findIndex(x=>re.test(x));
  colIdx.name=at(/^(商品名|品名|name|hin_name)$/i);
  colIdx.hin=at(/^(商品コード|hin_code)$/i);
  colIdx.pack=at(/入数|入り数|irisu/i);
  colIdx.lcode=at(/^(大分類コード|class_l)$/i); colIdx.lname=at(/^大分類(名)?$/);
  colIdx.mcode=at(/^(中分類コード)$/);           colIdx.mname=at(/^中分類(名)?$/);
  colIdx.scode=at(/^(小分類コード|class_s)$/i); colIdx.sname=at(/^小分類(名)?$/);
  colIdx.rankNo=at(/^(ランク番号|hseq)$/i);     colIdx.rank=at(/^(ランク|hrank)$/i);
  // 旧形式（Class_M / Class_Name）
  colIdx.cname=at(/class_?name|分類名|部門名|カテゴリ名/i);
  colIdx.ccode=at(/^class_?m$/i);
  if(colIdx.mname<0&&colIdx.cname>=0){colIdx.mname=colIdx.cname;colIdx.mcode=colIdx.ccode}
  if(colIdx.mcode<0&&colIdx.ccode>=0)colIdx.mcode=colIdx.ccode;
  renderMaster();
}
function cell(row,i){if(!(i>=0&&row))return"";let v=String(row[i]??"").trim();if(/^-?\d+\.0+$/.test(v))v=v.replace(/\.0+$/,"");return v}
function catText(row,ci,ni){return[cell(row,ci),cell(row,ni)].filter(Boolean).join("  ")}
function lookup(code){
  const c=norm(code);const tries=[c];
  if(c.length===12)tries.push("0"+c); if(c.length===13&&c[0]==="0")tries.push(c.slice(1));
  for(const t of tries){if(index.has(t))return{jan:t,row:index.get(t)}}return null;
}
function renderMaster(){
  const info=$("masterInfo");info.textContent="";
  if(!index.size){info.textContent="商品マスタが未登録です。下の「CSVを読み込む」から読み込んでください。";return}
  const fmt=t=>new Date(t).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  const b=document.createElement("strong");b.textContent=master.name;info.append(b);
  info.append(` ・ ${index.size.toLocaleString()}品目`+(master.updated?" ・ マスタ更新 "+fmt(master.updated):"")+(master.loaded?" ・ 取込 "+fmt(master.loaded):""));
}

/* ---------- CSV ---------- */
function decode(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^﻿/,"")}catch(e){return new TextDecoder("shift_jis").decode(buf)}}
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===","||c==="\t"){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows;
}

/* ---------- suffix suggestions ---------- */
const SUGG_MAX=50;
function suggest(q){
  const box=$("sugg"),list=$("suggList");
  if(q.length<3||q.length>7||!index.size){box.hidden=true;return null}
  // 一致する商品はすべて集める（件数の上限なし）。画面には50件ずつ表示する。
  const all=[];
  const exact=index.has(q)?q:null;
  if(exact)all.push(exact);
  for(const k of keys){if(k!==exact&&k.endsWith(q))all.push(k)}
  const total=all.length;
  list.textContent="";
  const head=shown=>$("suggHead").textContent=total?`下${q.length}桁「${q}」に一致：${total.toLocaleString()}件`+(total>shown?`（${shown.toLocaleString()}件を表示中）`:""):`下${q.length}桁「${q}」に一致する商品はありません`;
  if(!total){head(0);const li=document.createElement("li");li.className="none";li.textContent="桁数や数字を確認してください。";list.append(li);box.hidden=false;return{total:0}}
  let shown=0,moreLi=null;
  const page=()=>{if(moreLi){moreLi.remove();moreLi=null}
    all.slice(shown,shown+SUGG_MAX).forEach(addItem);shown=Math.min(total,shown+SUGG_MAX);head(shown);
    if(shown<total){moreLi=document.createElement("li");const mb=document.createElement("button");mb.type="button";mb.className="more";
      mb.textContent=`さらに表示（残り${(total-shown).toLocaleString()}件）`;mb.onclick=page;moreLi.append(mb);list.append(moreLi)}};
  function addItem(k){const row=index.get(k);const li=document.createElement("li");const b=document.createElement("button");b.type="button";
    const sj=document.createElement("span");sj.className="sj";
    if(k.endsWith(q)){sj.append(k.slice(0,k.length-q.length));const m=document.createElement("mark");m.textContent=q;sj.append(m)}else sj.textContent=k;
    const sc=document.createElement("span");sc.className="sc";const pk=cell(row,colIdx.pack);
    const rk=cell(row,colIdx.rank);
    sc.textContent=[cell(row,colIdx.mname),pk?pk+"個入":"",rk?"ランク"+rk:""].filter(Boolean).join(" ・ ");
    const sn=document.createElement("span");sn.className="sn";sn.textContent=cell(row,colIdx.name)||"（名称なし）";
    b.append(sj,sc,sn);b.onclick=()=>{handle(k,"下"+q.length+"桁から選択");$("manualJan").value="";box.hidden=true;
      $("result").scrollIntoView({behavior:"smooth",block:"nearest"})};
    li.append(b);list.append(li)}
  page();
  box.hidden=false;return{total,first:all[0]};
}

$("manualForm").addEventListener("submit",e=>{e.preventDefault();const v=norm($("manualJan").value);

/* ---------- live camera scan ---------- */
let scanMode="single",contCount=0,scanning=false,stream=null,zxReader=null,detTimer=null,last="",lastT=0;
function onCode(text){
  const c=norm(text);if(!c)return;const now=Date.now();
  // 同じバーコードを続けて読まない（連続スキャンでは別の商品を読むまで無視）
  if(c===last&&(scanMode==="cont"||now-lastT<2500))return;last=c;lastT=now;
  const aim=$("aim");aim.classList.add("hit");setTimeout(()=>aim.classList.remove("hit"),400);
  handle(c,"カメラ");
  if(scanMode==="single"){
    // 1件スキャン：読み取ったらカメラを止めて結果を見せる
    stopScan();
    setTimeout(()=>$("result").scrollIntoView({behavior:"smooth",block:"start"}),50);
  }else{
    // 連続スキャン：カメラはそのまま。読んだ件数を表示
    contCount++;const n=$("scanCount");n.hidden=false;n.textContent=`${contCount}件 読み取り`;
    {const c=norm(text),h=lookup(c);cmpAdd(h?h.jan:c,h&&h.row)}
  }
}
const ZX_FORMATS=()=>{const Z=ZXing;return[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.ITF,Z.BarcodeFormat.CODE_128]};
async function startScan(mode){
  if(scanning)return;
  scanMode=mode||"single";contCount=0;if(scanMode==="cont"){cmpItems=[];renderCmp()}last="";$("scanCount").hidden=true;
  $("scanHint").textContent=scanMode==="single"?"バーコードを枠に合わせると自動で読み取り、カメラが止まります":"続けて読み取れます。終わったら［スキャン停止］";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("この端末ではカメラを使えません。「写真から読み取る」か手入力を使ってください。",true);return}
  scanning=true;$("scanBtns").hidden=true;$("scanStop").hidden=false;$("videoWrap").hidden=false;setStatus("カメラを起動しています…");
  const video=$("video");
  const constraints={video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false};
  try{
    let useNative=false;
    if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();useNative=f.includes("ean_13")}catch(e){}}
    if(useNative){
      stream=await navigator.mediaDevices.getUserMedia(constraints);video.srcObject=stream;await video.play();
      const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","itf","code_128"]});
      const tick=async()=>{if(!scanning)return;try{const r=await det.detect(video);if(r&&r.length)onCode(r[0].rawValue)}catch(e){}detTimer=setTimeout(tick,120)};
      tick();
    }else{
      if(!window.ZXing)throw new Error("zxing");
      const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,ZX_FORMATS());
      zxReader=new ZXing.BrowserMultiFormatReader(hints,150);
      await zxReader.decodeFromConstraints(constraints,video,(res)=>{if(res&&scanning)onCode(res.getText())});
      stream=video.srcObject;
    }
    setStatus("");
    try{if(navigator.wakeLock)wakeLock=await navigator.wakeLock.request("screen")}catch(e){}
  }catch(err){
    stopScan();
    const denied=err&&(err.name==="NotAllowedError"||err.name==="SecurityError");
    setStatus(denied?"カメラの使用が許可されていません。設定でブラウザのカメラを許可してから、もう一度押してください。":"カメラを起動できませんでした。「写真から読み取る」か手入力を使ってください。",true);
  }
}
let wakeLock=null;
function stopScan(){
  scanning=false;clearTimeout(detTimer);
  try{zxReader&&zxReader.reset()}catch(e){}zxReader=null;
  try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;$("video").srcObject=null;
  try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null;
  $("videoWrap").hidden=true;$("scanBtns").hidden=false;$("scanStop").hidden=true;
  if(scanMode==="cont"&&contCount)setStatus(`連続スキャン：${contCount}件を読み取りました（履歴に残っています）`);
}

$("photo").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;setStatus("読み取り中…");
  try{
    if(!window.ZXing)throw new Error("読み取り部品を読み込めませんでした。");
    const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,ZX_FORMATS());hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    const r=new ZXing.BrowserMultiFormatReader(hints);const bmp=await createImageBitmap(f);
    for(const max of[1600,1000,2400]){const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const cv=document.createElement("canvas");
      cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
      const img=new Image();img.src=cv.toDataURL("image/jpeg",.92);await img.decode();
      try{const res=await r.decodeFromImageElement(img);setStatus("");handle(res.getText(),"写真から");return}catch(_){}}

async function gunzip(u8){

  return new Uint8Array(await new Response(ds).arrayBuffer());
}
async function loadSavedMaster(){if(index.size)return;try{const m=await IDB.get("master");if(m&&m.headers){setMaster(m);renderEmpty()}}catch(e){}}
async function syncMaster(force){
  if(!MASTER_URL||syncing)return "skip";
  const pass=getPass();
  if(!pass)return "nopass";
  if(!navigator.onLine)return "offline";
  syncing=true;$("syncBtn").disabled=true;syncNote("最新のマスタを確認しています…");
  try{
    const gz="DecompressionStream" in window;
    const v=force?0:(master.updated||0);
    const url=MASTER_URL+(MASTER_URL.includes("?")?"&":"?")+"p="+encodeURIComponent(pass)+"&v="+v+(gz?"&gz=1":"")+"&t="+Date.now();
    const res=await fetch(url,{cache:"no-store"});
    const j=await res.json();
    if(!j.ok){
      if(j.error==="bad_passcode")return "bad";
      if(j.error==="locked")return "locked";
      if(j.error==="not_found"){syncNote("サーバーに商品マスタが見つかりません。管理者に連絡してください。",true);return "ok"}
      syncNote("マスタを取得できませんでした（"+(j.error||"エラー")+"）。",true);return "error"}
    $("syncBtn").hidden=false;
    if(j.unchanged){syncNote("商品マスタは最新です。");return "ok"}
    let bytes=Uint8Array.from(atob(j.data),c=>c.charCodeAt(0));
    if(j.gz)bytes=await gunzip(bytes);
    const rows=parseCSV(decode(bytes.buffer));
    if(rows.length<2)throw new Error("データ行がありません。");
    const m={name:j.name||"item_master.csv",loaded:Date.now(),updated:j.updated,headers:rows[0].map(s=>s.trim()),rows:rows.slice(1)};
    setMaster(m);
    try{await IDB.set("master",m)}catch(e){}
    syncNote(`最新のマスタに更新しました（${index.size.toLocaleString()}品目）`);
    renderEmpty();return "ok";
  }catch(err){
    console.error("sync failed",err);return "error";
  }finally{syncing=false;$("syncBtn").disabled=false}
}
$("gateForm").addEventListener("submit",async e=>{e.preventDefault();
  const v=$("gateInput").value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).trim();
  if(!v){$("gateMsg").textContent="パスワードを入力してください。";return}
  $("gateBtn").disabled=true;$("gateBtn").textContent="確認中…";$("gateMsg").textContent="";
  const h=await hashPass(v);
  setPass(v);
  await loadSavedMaster();                 // 保存済みマスタを読み込み
  const r=await syncMaster(!index.size);   // ログインのたびにサーバーで最新か確認・更新
  $("gateBtn").disabled=false;$("gateBtn").textContent="ログイン";
  if(r==="ok"){setHash(h);$("gateInput").value="";$("gateInput").blur();lastActive=Date.now();showApp();return}
  if(r==="bad"){setPass("");clearScreen();$("gateMsg").textContent="パスワードが違います。";$("gateInput").select();return}
  if(r==="locked"){setPass("");clearScreen();$("gateMsg").textContent="入力ミスが続いたため、10分間ログインできません。";return}
  // 電波がない・サーバーにつながらないとき：前回ログインしたパスワードと同じなら保存済みマスタで使う
  if(getHash()&&h===getHash()&&index.size){
    $("gateInput").value="";$("gateInput").blur();showApp();
    syncNote("オフラインのため、保存済みのマスタで照合しています（電波が戻ると自動で更新します）。");return}
  setPass("");clearScreen();
  $("gateMsg").textContent=getHash()&&h!==getHash()?"パスワードが違います。":"サーバーに接続できませんでした。初回のログインにはインターネット接続が必要です。";
});
async function runSync(force){
  const r=await syncMaster(force);
  if(r==="bad")await lockAndClear("パスワードが変更されました。新しいパスワードを入力してください。");
  else if(r==="locked")syncNote("パスワードの入力ミスが続いたため、10分間取得できません。",true);
  else if(r==="offline")syncNote("オフラインのため、保存済みのマスタで照合しています。");
  else if(r==="error")syncNote(index.size?"マスタを確認できませんでした。保存済みのマスタで照合しています。":"マスタを取得できませんでした。",!index.size);
  return r;
}
$("syncBtn").addEventListener("click",()=>runSync(true));
$("logoutBtn").addEventListener("click",()=>logout("ログアウトしました。",true));
$("endBtn").addEventListener("click",()=>logout("ログアウトしました。お疲れさまでした。",true));
// 操作があるたびに時刻を記録し、一定時間操作がなければログアウト
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{lastActive=Date.now()},{passive:true}));
setInterval(()=>{
  if(getPass()&&!$("app").hidden&&Date.now()-lastActive>IDLE_LOGOUT_MS)
    logout(`${Math.round(IDLE_LOGOUT_MS/60000)}分間操作がなかったため、ログアウトしました。`);
},20000);
addEventListener("online",()=>{if(getPass()&&!$("app").hidden)runSync(false)});
// アプリを閉じる・別のアプリに切り替える → 戻ったときに一定時間たっていればログアウト
document.addEventListener("visibilitychange",()=>{
  if(!getPass())return;
  try{
    if(document.hidden)sessionStorage.setItem("jan.hiddenAt",String(Date.now()));
    else{const t=Number(sessionStorage.getItem("jan.hiddenAt")||0);sessionStorage.removeItem("jan.hiddenAt");
      if(t&&Date.now()-t>AWAY_LOGOUT_MS)logout("アプリを閉じたため、ログアウトしました。");}
  }catch(e){}
});
addEventListener("pagehide",()=>{if(getPass()){try{sessionStorage.setItem("jan.hiddenAt",String(Date.now()))}catch(e){}}});

/* ---------- init ---------- */
renderMaster();renderHistory();renderEmpty();
(async()=>{
  if(!MASTER_URL){showApp();await loadSavedMaster();return}
  let away=0;try{away=Number(sessionStorage.getItem("jan.hiddenAt")||0)}catch(e){}
  if(!getPass()||(away&&Date.now()-away>AWAY_LOGOUT_MS)){setPass("");showGate(getHash()?"前回アプリを閉じたため、ログアウトしました。":"");return}
  try{sessionStorage.removeItem("jan.hiddenAt")}catch(e){}
  showApp();await loadSavedMaster();runSync(false);
})();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
