<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JAN照合スキャナー</title>
<meta name="theme-color" content="#0f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JANスキャナー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: one narrow column like a handheld terminal — scan area on top, input with suggestions, result card, history, master */
:root{
  --bg:#eef1ef; --surface:#ffffff; --fg:#17201c; --muted:#5d6a64; --line:#d3dad6;
  --accent:#0f6b4f; --accent-fg:#ffffff; --accent-soft:#dcefe7;
  --warn:#9a5a00; --warn-soft:#fbefd9; --err:#a3302a; --err-soft:#f8e0de; --hl:#fff1a8;
  --font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111715; --surface:#1a2320; --fg:#e6ece9; --muted:#9aa8a1; --line:#2c3833;
  --accent:#4fc39a; --accent-fg:#06231a; --accent-soft:#183a2e;
  --warn:#f0b35a; --warn-soft:#3a2c14; --err:#f08a82; --err-soft:#3d1f1d; --hl:#5a4a00; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.net{font-size:12px;color:var(--muted)}
.label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);
  padding:12px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;
  -webkit-tap-highlight-color:transparent}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;font-size:17px;padding:16px}
.primary.stop{background:var(--surface);color:var(--fg);border-color:var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.video-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.video-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.video-wrap .aim{position:absolute;left:8%;right:8%;top:38%;height:24%;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.35);transition:border-color .15s}
.video-wrap .aim.hit{border-color:#4fc39a}
.video-wrap .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
.status{font-size:13px;color:var(--muted);min-height:1.4em;margin:0}
.status.err{color:var(--err)}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;font:inherit;font-family:var(--font-mono);font-size:18px;letter-spacing:.06em;
  padding:11px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.sugg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sugg-head{font-size:12px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.sugg ul{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sugg li button{width:100%;border:0;border-top:1px solid var(--line);border-radius:0;background:none;
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:10px 12px;font-weight:400}
.sugg li:first-child button{border-top:0}
.sugg .sj{font-family:var(--font-mono);font-size:14px;letter-spacing:.04em;color:var(--muted)}
.sugg .sj mark{background:var(--hl);color:var(--fg);border-radius:3px;padding:0 1px;font-weight:700}
.sugg .sn{grid-column:1/-1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg .sc{font-size:12px;color:var(--muted);white-space:nowrap}
.sugg li button.more{display:flex;justify-content:center;color:var(--accent);font-weight:700}
.sugg .none{padding:12px;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.found{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.missing{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.chip{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.no{background:var(--warn-soft);color:var(--warn)}
.jan{font-size:22px;letter-spacing:.08em;margin:0}
.jan span{margin-right:.45em}
.cls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.cls .code{background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:6px}
.pname{font-size:20px;font-weight:700;margin:0;line-height:1.4}
.meta{font-size:12px;color:var(--muted)}
.meta.err{color:var(--err)}
dl.fields{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;border-top:1px solid var(--line);padding-top:10px}
dl.fields dt{color:var(--muted);font-size:13px}
dl.fields dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
dl.fields dd.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;margin:0}
section{display:flex;flex-direction:column;gap:8px}
ul.hist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
ul.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
ul.hist li:first-child{border-top:0}
ul.hist .t{font-size:12px;color:var(--muted)}
ul.hist .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dot.no{background:var(--warn)}
.master{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.master p{margin:0;font-size:13px;color:var(--muted)}
.master strong{color:var(--fg)}
.tag{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:1px 8px;border-radius:999px;margin-left:6px}
code{font-family:var(--font-mono);font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
footer{font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.card.flash{animation:fl .35s ease}@keyframes fl{from{transform:scale(.98)}to{transform:none}}}
</style>
</head>
<body>
<main>
  <header>
    <h1>JAN照合スキャナー</h1>
    <span class="net" id="net"></span>
  </header>

  <section aria-label="読み取り">
    <button type="button" class="primary" id="scanBtn">スキャン開始</button>
    <div class="video-wrap" id="videoWrap" hidden>
      <video id="video" playsinline muted autoplay></video>
      <div class="aim" id="aim"></div>
      <div class="hint">バーコードを枠に合わせると自動で読み取ります</div>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <section aria-label="手入力">
    <form class="manual" id="manualForm" autocomplete="off">
      <input id="manualJan" inputmode="numeric" pattern="[0-9]*" maxlength="14" placeholder="JAN または 下5桁" aria-label="JANコードまたは下5桁">
      <button type="submit">照合</button>
    </form>
    <div class="sugg" id="sugg" hidden>
      <div class="sugg-head"><span id="suggHead"></span><span>タップで選択</span></div>
      <ul id="suggList"></ul>
    </div>
  </section>

  <article class="card" id="result"></article>

  <section>
    <span class="label">スキャン履歴</span>
    <ul class="hist" id="hist"></ul>
  </section>

  <section>
    <span class="label">商品マスタ</span>
    <div class="master">
      <p id="masterInfo"></p>
      <p>CSVの1行目は見出しにしてください。<code>JAN</code>の列が必須で、<code>商品名</code>・<code>入数</code>・<code>Class_M</code>・<code>Class_Name</code>のほか、追加した列もそのまま表示されます。読み込んだマスタは端末に保存され、電波がなくても使えます。</p>
      <div class="row2">
        <label class="btn" for="csv">CSVを読み込む</label>
        <input id="csv" class="hidden-input" type="file" accept=".csv,text/csv,text/plain,text/comma-separated-values">
        <label class="btn" for="photo">写真から読み取る</label>
        <input id="photo" class="hidden-input" type="file" accept="image/*">
      </div>
    </div>
  </section>

  <footer>JAN照合スキャナー v2 ・ バーコード読み取り: ZXing (Apache License 2.0)</footer>
</main>

<script src="zxing.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);

/* ---------- storage ---------- */
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
const IDB={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open("janscan",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("kv",mode);const st=t.objectStore("kv");
    const req=fn(st);t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(k){return this.run("readonly",s=>s.get(k))},
  set(k,v){return this.run("readwrite",s=>s.put(v,k))}
};

/* ---------- master ---------- */
let master={headers:[],rows:[],name:"",ci:-1}, index=new Map(), keys=[], history=load("jan.hist")||[];
const JAN_KEYS=["jan","jan_code","jancode","janコード","バーコード","barcode","ean","商品コード"];
function findCol(h,list){const n=h.map(x=>String(x).trim().toLowerCase().replace(/\s/g,""));for(const k of list){const i=n.indexOf(k);if(i>=0)return i}return -1}
function norm(s){return String(s||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\D/g,"")}
const colIdx={};
function setMaster(m){
  let ci=findCol(m.headers,JAN_KEYS); if(ci<0)ci=m.headers.findIndex(x=>/jan/i.test(x));
  if(ci<0)throw new Error("JANの列が見つかりません。1行目に「JAN」という見出しを入れてください。");
  index=new Map();
  for(const r of m.rows){const j=norm(r[ci]);if(j)index.set(j,r)}
  keys=[...index.keys()];
  master={...m,ci};
  const h=m.headers;
  colIdx.name=h.findIndex(x=>/商品名|品名|^name$|hin_name/i.test(String(x).trim()));
  colIdx.cname=h.findIndex(x=>/class_?name|分類名|部門名|カテゴリ名/i.test(String(x).trim()));
  colIdx.ccode=h.findIndex(x=>/^class_?m$|分類コード|部門コード/i.test(String(x).trim()));
  colIdx.pack=h.findIndex(x=>/入数|入り数|irisu/i.test(String(x).trim()));
  renderMaster();
}
function cell(row,i){return i>=0&&row?String(row[i]??"").trim():""}
function lookup(code){
  const c=norm(code);const tries=[c];
  if(c.length===12)tries.push("0"+c); if(c.length===13&&c[0]==="0")tries.push(c.slice(1));
  for(const t of tries){if(index.has(t))return{jan:t,row:index.get(t)}}return null;
}
function renderMaster(){
  const info=$("masterInfo");info.textContent="";
  if(!index.size){info.textContent="商品マスタが未登録です。下の「CSVを読み込む」から読み込んでください。";return}
  const b=document.createElement("strong");b.textContent=master.name;info.append(b);
  info.append(` ・ ${index.size.toLocaleString()}品目`+(master.loaded?" ・ 読込 "+new Date(master.loaded).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):""));
}

/* ---------- CSV ---------- */
function decode(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^﻿/,"")}catch(e){return new TextDecoder("shift_jis").decode(buf)}}
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===","||c==="\t"){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
$("csv").addEventListener("change",async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  setStatus("読み込み中…");
  try{
    const rows=parseCSV(decode(await file.arrayBuffer()));
    if(rows.length<2)throw new Error("データ行がありません。");
    const m={name:file.name,loaded:Date.now(),headers:rows[0].map(s=>s.trim()),rows:rows.slice(1)};
    setMaster(m);
    let saved=true;try{await IDB.set("master",m)}catch(err){saved=false}
    setStatus(saved?`${file.name} を読み込み、端末に保存しました（${index.size.toLocaleString()}品目）`
                   :`${index.size.toLocaleString()}品目を読み込みましたが、端末に保存できませんでした。開き直すたびに読み込みが必要です。`,!saved);
    renderEmpty();
  }catch(err){setStatus("CSVを読み込めませんでした。"+err.message,true)}
});

/* ---------- result ---------- */
function checkOk(c){if(!/^\d{8}$|^\d{12,14}$/.test(c))return null;const d=c.slice(0,-1).split("").reverse();let s=0;d.forEach((x,i)=>s+=+x*(i%2?1:3));return(10-s%10)%10===+c.slice(-1)}
function janEl(c){const el=document.createElement("p");el.className="jan mono";
  const parts=c.length===13?[c[0],c.slice(1,7),c.slice(7)]:c.length===8?[c.slice(0,4),c.slice(4)]:[c];
  parts.forEach(p=>{const s=document.createElement("span");s.textContent=p;el.append(s)});return el}
function render(code,hit,src){
  const card=$("result");card.className="card flash "+(hit?"found":"missing");card.textContent="";void card.offsetWidth;
  const row=hit&&hit.row; const jan=hit?hit.jan:code;
  const chip=document.createElement("span");chip.className="chip "+(row?"ok":"no");chip.textContent=row?"マスタ登録あり":"マスタ未登録";card.append(chip);
  card.append(janEl(jan));
  const meta=document.createElement("div");meta.className="meta";
  const ck=checkOk(jan);meta.textContent=src;
  if(ck===false){meta.textContent+=" ・ チェックデジット不一致：読み取りを確認してください";meta.className="meta err"}
  card.append(meta);
  if(!row){const p=document.createElement("p");p.className="empty";
    p.textContent=index.size?"この商品はマスタに登録されていません。登録漏れやJANの変更がないか確認してください。":"商品マスタが未登録です。下の「CSVを読み込む」から読み込んでください。";
    card.append(p);return}
  if(colIdx.cname>=0||colIdx.ccode>=0){const c=document.createElement("div");c.className="cls";
    const cc=cell(row,colIdx.ccode);if(cc){const s=document.createElement("span");s.className="code mono";s.textContent=cc;c.append(s)}
    const s=document.createElement("span");s.textContent=cell(row,colIdx.cname)||"分類なし";c.append(s);card.append(c)}
  const n=document.createElement("p");n.className="pname";n.textContent=cell(row,colIdx.name)||"（名称なし）";card.append(n);
  const dl=document.createElement("dl");dl.className="fields";
  master.headers.forEach((k,i)=>{if(i===master.ci||i===colIdx.name||i===colIdx.cname||i===colIdx.ccode||!k)return;
    const dt=document.createElement("dt");dt.textContent=k;const dd=document.createElement("dd");let v=cell(row,i);
    if(i===colIdx.pack&&/^\d+$/.test(v)){v=Number(v).toLocaleString()+" 個入";dd.className="num"}
    dd.textContent=v||"—";dl.append(dt,dd)});
  if(dl.children.length)card.append(dl);
}
function renderEmpty(){const c=$("result");c.className="card";c.textContent="";const p=document.createElement("p");p.className="empty";
  p.textContent=index.size?"「スキャン開始」を押してバーコードにカメラを向けるか、JANまたは下5桁を入力してください。":"まず下の「CSVを読み込む」から商品マスタを読み込んでください。";c.append(p)}

/* ---------- history ---------- */
function addHistory(jan,row){
  history=history.filter(h=>h.code!==jan);
  history.unshift({code:jan,name:row?cell(row,colIdx.name):"",hit:!!row,t:Date.now()});
  history=history.slice(0,30);store("jan.hist",history);renderHistory();
}
function renderHistory(){
  const ul=$("hist");ul.textContent="";
  if(!history.length){const li=document.createElement("li");li.style.cursor="default";const s=document.createElement("span");s.className="n";s.style.color="var(--muted)";s.textContent="履歴はまだありません";li.append(document.createElement("span"),s,document.createElement("span"));ul.append(li);return}
  history.forEach(h=>{const li=document.createElement("li");li.tabIndex=0;
    const d=document.createElement("span");d.className="dot"+(h.hit?"":" no");
    const n=document.createElement("span");n.className="n";n.textContent=h.name||((h.hit?"":"未登録 ")+h.code);
    const t=document.createElement("span");t.className="t mono";const dt=new Date(h.t);t.textContent=dt.getHours()+":"+String(dt.getMinutes()).padStart(2,"0");
    li.append(d,n,t);const go=()=>handle(h.code,"履歴から");li.onclick=go;li.onkeydown=e=>{if(e.key==="Enter")go()};ul.append(li)});
}

/* ---------- handle ---------- */
function setStatus(msg,err){const s=$("status");s.textContent=msg||"";s.className="status"+(err?" err":"")}
function handle(code,src){
  const c=norm(code);if(!c)return;
  const hit=lookup(c);render(c,hit,src);addHistory(hit?hit.jan:c,hit&&hit.row);
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  beep();
}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.value=1800;g.gain.value=.06;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.07)}catch(e){}}

/* ---------- suffix suggestions ---------- */
const SUGG_MAX=50;
function suggest(q){
  const box=$("sugg"),list=$("suggList");
  if(q.length<3||q.length>7||!index.size){box.hidden=true;return null}
  // 一致する商品はすべて集める（件数の上限なし）。画面には50件ずつ表示する。
  const all=[];
  const exact=index.has(q)?q:null;
  if(exact)all.push(exact);
  for(const k of keys){if(k!==exact&&k.endsWith(q))all.push(k)}
  const total=all.length;
  list.textContent="";
  const head=shown=>$("suggHead").textContent=total?`下${q.length}桁「${q}」に一致：${total.toLocaleString()}件`+(total>shown?`（${shown.toLocaleString()}件を表示中）`:""):`下${q.length}桁「${q}」に一致する商品はありません`;
  if(!total){head(0);const li=document.createElement("li");li.className="none";li.textContent="桁数や数字を確認してください。";list.append(li);box.hidden=false;return{total:0}}
  let shown=0,moreLi=null;
  const page=()=>{if(moreLi){moreLi.remove();moreLi=null}
    all.slice(shown,shown+SUGG_MAX).forEach(addItem);shown=Math.min(total,shown+SUGG_MAX);head(shown);
    if(shown<total){moreLi=document.createElement("li");const mb=document.createElement("button");mb.type="button";mb.className="more";
      mb.textContent=`さらに表示（残り${(total-shown).toLocaleString()}件）`;mb.onclick=page;moreLi.append(mb);list.append(moreLi)}};
  function addItem(k){const row=index.get(k);const li=document.createElement("li");const b=document.createElement("button");b.type="button";
    const sj=document.createElement("span");sj.className="sj";
    if(k.endsWith(q)){sj.append(k.slice(0,k.length-q.length));const m=document.createElement("mark");m.textContent=q;sj.append(m)}else sj.textContent=k;
    const sc=document.createElement("span");sc.className="sc";const pk=cell(row,colIdx.pack);
    sc.textContent=[cell(row,colIdx.cname),pk?pk+"個入":""].filter(Boolean).join(" ・ ");
    const sn=document.createElement("span");sn.className="sn";sn.textContent=cell(row,colIdx.name)||"（名称なし）";
    b.append(sj,sc,sn);b.onclick=()=>{handle(k,"下"+q.length+"桁から選択");$("manualJan").value="";box.hidden=true;
      $("result").scrollIntoView({behavior:"smooth",block:"nearest"})};
    li.append(b);list.append(li)}
  page();
  box.hidden=false;return{total,first:all[0]};
}
$("manualJan").addEventListener("input",e=>{const v=norm(e.target.value);if(v!==e.target.value)e.target.value=v;suggest(v)});
$("manualForm").addEventListener("submit",e=>{e.preventDefault();const v=norm($("manualJan").value);
  if(!v){setStatus("JANまたは下5桁を入力してください。",true);return}
  if(v.length>=8){handle(v,"手入力");$("manualJan").value="";$("sugg").hidden=true;$("manualJan").blur();return}
  const s=suggest(v);
  if(s&&s.total===1){handle(s.first,"下"+v.length+"桁から");$("manualJan").value="";$("sugg").hidden=true;$("manualJan").blur()}
  else if(s&&s.total>1){$("manualJan").blur();setStatus("候補から商品を選んでください。")}
  else if(s&&s.total===0)setStatus("一致する商品がありません。数字を確認してください。",true);
  else if(!s)setStatus("3〜7桁で下の桁を入力するか、8桁または13桁のJANを入力してください。",true);
});

/* ---------- live camera scan ---------- */
let scanning=false,stream=null,zxReader=null,detTimer=null,last="",lastT=0;
function onCode(text){
  const c=norm(text);if(!c)return;const now=Date.now();
  if(c===last&&now-lastT<2500)return;last=c;lastT=now;
  const aim=$("aim");aim.classList.add("hit");setTimeout(()=>aim.classList.remove("hit"),400);
  handle(c,"カメラ");
}
const ZX_FORMATS=()=>{const Z=ZXing;return[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.ITF,Z.BarcodeFormat.CODE_128]};
async function startScan(){
  if(scanning)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("この端末ではカメラを使えません。「写真から読み取る」か手入力を使ってください。",true);return}
  scanning=true;$("scanBtn").textContent="スキャン停止";$("scanBtn").classList.add("stop");$("videoWrap").hidden=false;setStatus("カメラを起動しています…");
  const video=$("video");
  const constraints={video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false};
  try{
    let useNative=false;
    if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();useNative=f.includes("ean_13")}catch(e){}}
    if(useNative){
      stream=await navigator.mediaDevices.getUserMedia(constraints);video.srcObject=stream;await video.play();
      const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","itf","code_128"]});
      const tick=async()=>{if(!scanning)return;try{const r=await det.detect(video);if(r&&r.length)onCode(r[0].rawValue)}catch(e){}detTimer=setTimeout(tick,120)};
      tick();
    }else{
      if(!window.ZXing)throw new Error("zxing");
      const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,ZX_FORMATS());
      zxReader=new ZXing.BrowserMultiFormatReader(hints,150);
      await zxReader.decodeFromConstraints(constraints,video,(res)=>{if(res&&scanning)onCode(res.getText())});
      stream=video.srcObject;
    }
    setStatus("");
    try{if(navigator.wakeLock)wakeLock=await navigator.wakeLock.request("screen")}catch(e){}
  }catch(err){
    stopScan();
    const denied=err&&(err.name==="NotAllowedError"||err.name==="SecurityError");
    setStatus(denied?"カメラの使用が許可されていません。設定でブラウザのカメラを許可してから、もう一度押してください。":"カメラを起動できませんでした。「写真から読み取る」か手入力を使ってください。",true);
  }
}
let wakeLock=null;
function stopScan(){
  scanning=false;clearTimeout(detTimer);
  try{zxReader&&zxReader.reset()}catch(e){}zxReader=null;
  try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;$("video").srcObject=null;
  try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null;
  $("videoWrap").hidden=true;$("scanBtn").textContent="スキャン開始";$("scanBtn").classList.remove("stop");
}
$("scanBtn").addEventListener("click",()=>{scanning?stopScan():startScan()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&scanning)stopScan()});

/* ---------- photo fallback ---------- */
$("photo").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;setStatus("読み取り中…");
  try{
    if(!window.ZXing)throw new Error("読み取り部品を読み込めませんでした。");
    const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,ZX_FORMATS());hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    const r=new ZXing.BrowserMultiFormatReader(hints);const bmp=await createImageBitmap(f);
    for(const max of[1600,1000,2400]){const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const cv=document.createElement("canvas");
      cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
      const img=new Image();img.src=cv.toDataURL("image/jpeg",.92);await img.decode();
      try{const res=await r.decodeFromImageElement(img);setStatus("");handle(res.getText(),"写真から");return}catch(_){}}
    setStatus("バーコードが見つかりませんでした。ピントの合った写真で撮り直してください。",true);
  }catch(err){setStatus(err.message||"画像を読み込めませんでした。",true)}
});

/* ---------- online / offline ---------- */
function net(){$("net").textContent=navigator.onLine?"オンライン":"オフライン（端末内のマスタで照合中）"}
addEventListener("online",net);addEventListener("offline",net);net();

renderMaster();renderHistory();renderEmpty();
IDB.get("master").then(m=>{if(m&&m.headers){setMaster(m);renderEmpty()}}).catch(()=>{});
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
